apiVersion: v1
kind: Secret
metadata:
  name: blackjack-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: blackjack
  POSTGRES_USER: blackjack
  POSTGRES_PASSWORD: blackjack123

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackjack-postgres-init
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS operaciones (
        operation_id UUID PRIMARY KEY,
        partida_id VARCHAR(50) NOT NULL,
        jugador VARCHAR(50) NOT NULL,
        accion VARCHAR(20) NOT NULL
            CHECK (accion IN ('HIT', 'STAND')),
        processor_id VARCHAR(100) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_operaciones_partida_id
    ON operaciones (partida_id);

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blackjack-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackjack-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackjack-postgres
  template:
    metadata:
      labels:
        app: blackjack-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: blackjack-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - blackjack
                - -d
                - blackjack
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - blackjack
                - -d
                - blackjack
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: blackjack-postgres-pvc
        - name: postgres-init
          configMap:
            name: blackjack-postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: blackjack-postgres
spec:
  selector:
    app: blackjack-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
